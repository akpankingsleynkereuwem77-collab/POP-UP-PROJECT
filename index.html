<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f5fa">
    <title>Button &amp; Popup</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #20213a;
            background: #f5f5fa;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
            background:
                radial-gradient(ellipse at 15% 15%, rgb(168 153 255 / 18%), transparent 38%),
                radial-gradient(ellipse at 85% 85%, rgb(103 211 210 / 16%), transparent 35%),
                #f5f5fa;
        }

        .showcase {
            width: min(100%, 540px);
            padding: clamp(32px, 8vw, 64px);
            text-align: center;
            background: rgb(255 255 255 / 82%);
            border: 1px solid rgb(255 255 255 / 90%);
            border-radius: 28px;
            box-shadow: 0 24px 80px rgb(39 35 79 / 12%);
            backdrop-filter: blur(16px);
            animation: card-arrive 700ms cubic-bezier(.2, .8, .2, 1) both;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 18px;
            color: #6555c7;
            font-size: 0.76rem;
            font-weight: 750;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .eyebrow::before {
            width: 7px;
            height: 7px;
            background: #7a68ed;
            border-radius: 50%;
            content: "";
            box-shadow: 0 0 0 4px rgb(122 104 237 / 12%);
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 7vw, 3.35rem);
            letter-spacing: -0.055em;
            line-height: 1.08;
        }

        .description {
            max-width: 360px;
            margin: 18px auto 32px;
            color: #717187;
            font-size: 1rem;
            line-height: 1.7;
        }

        .open-button {
            display: inline-flex;
            min-height: 56px;
            align-items: center;
            justify-content: center;
            gap: 11px;
            padding: 0 25px;
            color: #fff;
            font: inherit;
            font-size: 0.98rem;
            font-weight: 700;
            background: linear-gradient(115deg, #735ce7, #5544c8);
            border: 0;
            border-radius: 16px;
            box-shadow: 0 10px 24px rgb(99 78 211 / 30%);
            cursor: pointer;
            transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
        }

        .open-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgb(99 78 211 / 38%);
            filter: saturate(1.12);
        }

        .open-button:active {
            transform: translateY(0) scale(0.97);
        }

        .open-button:focus-visible,
        .close-button:focus-visible,
        .dialog-action:focus-visible {
            outline: 3px solid #a99cff;
            outline-offset: 4px;
        }

        .open-button svg {
            width: 19px;
            height: 19px;
            transition: transform 180ms ease;
        }

        .open-button:hover svg {
            transform: translateX(3px);
        }

        dialog {
            width: min(440px, calc(100% - 32px));
            max-width: none;
            max-height: calc(100% - 32px);
            padding: 0;
            overflow: visible;
            color: #20213a;
            background: transparent;
            border: 0;
        }

        dialog[open] {
            animation: popup-arrive 360ms cubic-bezier(.2, .85, .25, 1) both;
        }

        dialog::backdrop {
            background: rgb(24 22 43 / 48%);
            backdrop-filter: blur(5px);
            animation: backdrop-arrive 260ms ease both;
        }

        dialog.is-closing {
            animation: popup-leave 180ms ease-in both;
            pointer-events: none;
        }

        dialog.is-closing::backdrop {
            animation: backdrop-leave 180ms ease-in both;
        }

        .popup-card {
            position: relative;
            padding: 42px 36px 34px;
            text-align: center;
            background: #fff;
            border: 1px solid rgb(255 255 255 / 80%);
            border-radius: 26px;
            box-shadow: 0 28px 90px rgb(19 16 53 / 24%);
        }

        .close-button {
            position: absolute;
            top: 16px;
            right: 16px;
            display: grid;
            width: 38px;
            height: 38px;
            padding: 0;
            place-items: center;
            color: #77768c;
            background: #f4f3f9;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            transition: color 160ms ease, background 160ms ease, transform 160ms ease;
        }

        .close-button:hover {
            color: #292640;
            background: #eae8f4;
            transform: rotate(90deg);
        }

        .close-button svg {
            width: 18px;
            height: 18px;
        }

        .success-icon {
            display: grid;
            width: 68px;
            height: 68px;
            margin: 0 auto 23px;
            place-items: center;
            color: #fff;
            background: linear-gradient(145deg, #9b8bff, #6953dc);
            border-radius: 22px;
            box-shadow: 0 10px 24px rgb(105 83 220 / 28%);
            animation: icon-pop 500ms 100ms cubic-bezier(.2, .9, .3, 1.4) both;
        }

        .success-icon svg {
            width: 31px;
            height: 31px;
        }

        .popup-card h2 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: -0.04em;
        }

        .popup-card p {
            margin: 13px 0 27px;
            color: #717187;
            font-size: 0.98rem;
            line-height: 1.65;
        }

        .dialog-action {
            width: 100%;
            min-height: 50px;
            color: #fff;
            font: inherit;
            font-weight: 700;
            background: #24223c;
            border: 0;
            border-radius: 14px;
            cursor: pointer;
            transition: transform 160ms ease, background 160ms ease;
        }

        .dialog-action:hover {
            background: #393655;
            transform: translateY(-2px);
        }

        @keyframes card-arrive {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popup-arrive {
            from { opacity: 0; transform: translateY(18px) scale(0.94); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes popup-leave {
            to { opacity: 0; transform: translateY(8px) scale(0.97); }
        }

        @keyframes backdrop-arrive {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes backdrop-leave {
            to { opacity: 0; }
        }

        @keyframes icon-pop {
            from { opacity: 0; transform: scale(0.65) rotate(-12deg); }
            to { opacity: 1; transform: scale(1) rotate(0); }
        }

        @media (max-width: 480px) {
            .popup-card {
                padding: 38px 24px 26px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
    <script src="button-pop.js" defer></script>
</head>
<body>
    <main class="showcase">
        <p class="eyebrow">A little moment of delight</p>
        <h1>Make your next click count.</h1>
        <p class="description">
            A simple button can open up something special. Give it a click and see.
        </p>
        <button class="open-button" id="openPopup" type="button" aria-haspopup="dialog" aria-controls="welcomePopup">
            Open the popup
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
    </main>

    <dialog id="welcomePopup" aria-labelledby="popupTitle" aria-describedby="popupDescription">
        <section class="popup-card">
            <button class="close-button" id="closePopup" type="button" aria-label="Close popup">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <div class="success-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="m5 12.5 4.5 4.5L19 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h2 id="popupTitle">Well, hello there!</h2>
            <p id="popupDescription">
                You made it happen. This little popup is ready whenever you are.
            </p>
            <button class="dialog-action" id="donePopup" type="button">Lovely, thanks</button>
        </section>
    </dialog>
</body>
</html>
